name: CI

# Faz-0 güven-tabanı (docs/portfoy-degerlendirme.md §4.8, ortim-core-backend
# repo). Bir governance/audit aracının kendisi test edilmeden yayınlanamaz —
# bu workflow'dan önce .github/workflows/ boştu, PyPI'ya (v0.9.6) elle
# yayınlanıyordu, regresyon koruması yoktu.

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR should cancel the still-running CI for the
# first — no point burning minutes checking a commit that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check .

      - name: pytest (fast suite)
        run: python -m pytest -q

      - name: pytest (e2e replay fixtures)
        # Offline — regression tests against frozen real-LLM artifacts
        # bundled with the package, not live API calls. Safe in CI,
        # no secrets needed; verified locally before wiring this in.
        run: python -m pytest -q -m e2e

  test-windows:
    name: test (windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: pytest (fast suite)
        # Windows gets its own job (not folded into the Linux matrix)
        # because at least one real regression here was Windows-specific
        # (process-tree cleanup on test-runner timeout, executor/test_runner.py) —
        # ruff/mypy are platform-agnostic enough that one OS covers them.
        run: python -m pytest -q

  typecheck:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (editable, with dev extras)
        run: python -m pip install -e ".[dev]"

      - name: mypy
        # NOT blocking yet: `[tool.mypy] strict = true` surfaces ~161
        # pre-existing errors across ~33 files accumulated with no CI to
        # catch them (this workflow's whole reason for existing). That's
        # real, separate debt-paydown work — tracked, not silently
        # dropped. New code should still pass strict mypy on its own
        # (ortim/executor/test_runner.py does); this step stays visible
        # so regressions are seen, without blocking merges on debt nobody
        # asked this PR to fix. Flip `continue-on-error` off once the
        # backlog is paid down.
        run: python -m mypy ortim/
        continue-on-error: true
