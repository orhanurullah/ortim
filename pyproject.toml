[project]
name = "ortim"
version = "0.9.5"
description = "Disciplined multi-agent AI software factory: brief -> PRD -> RFC -> task DAG -> reviewed code, with human gates and a hash-chained audit trail"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "FSL-1.1-Apache-2.0" }
authors = [{ name = "ortim.dev", email = "contact@ortim.dev" }]
keywords = [
    "llm", "agents", "multi-agent", "code-generation", "ai-coding",
    "ai-pipeline", "orchestration", "audit", "governance", "devtools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "anthropic>=0.39.0",
    "pydantic>=2.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://ortim.dev"
Documentation = "https://ortim.dev/docs"
Source = "https://github.com/orhanurullah/ortim"
Issues = "https://github.com/orhanurullah/ortim/issues"
Changelog = "https://github.com/orhanurullah/ortim/blob/main/CHANGELOG.md"

[project.scripts]
ortim = "ortim.main:app"
ai-factory = "ortim.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ortim*"]

# Bundle markdown assets (agents/, skills/, principles/, glossary/,
# golden-paths/) so PyPI installs ship the full runtime. Without this,
# MemoryLoader.load_agent_prompt() raises FileNotFoundError at first
# LLM call because the wheel only contained Python sources.
[tool.setuptools.package-data]
"ortim._assets" = [
    "agents/*.md",
    "skills/**/*.md",
    "principles/*.md",
    "glossary/*.md",
    "golden-paths/*.md",
    "templates/*.md",
    "replay/*.jsonl",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# E2E baselines pin the shape and key content of frozen real-LLM artifacts.
# Default-deselected to keep the fast suite at <30s; opt-in with `-m e2e`.
addopts = ["-m", "not e2e"]
markers = [
    "e2e: regression tests against captured real-LLM artifacts (opt-in: pytest -m e2e)",
]
